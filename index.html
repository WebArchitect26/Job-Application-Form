<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <center><h1>Job Application Form</h1></center>
    <h2><u>Personal Details</u></h2>
    <label>Full name: <input type="text" placeholder="Enter your full name"></label>
    <br><br>
    <label>Email Address: <input type="text" placeholder="Enter your email"></label>
    <br><br>
    <label>Create Password: <input type="password" placeholder="Create a password"></label>
    <br><br>
    <label>Phone Number: <input type="number" placeholder="Enter your phone number"></label>
    <br><br>
    <label>Date of Birth: <input type="date"></label>
    <br><br>
    <label>Gender:</label>
    <label><input type="radio" name="Gender" value="Male">Male</label>
    <label><input type="radio" name="Gender" value="Female">Female</label>
    <label><input type="radio" name="Gender" value="Prefer not to say">Prefer not to say</label>
    <br><br>
    <h2><u>Job Details</u></h2>
    <label>Position applying for:</label>
    <label><input type="radio" name="Job Details" value="Web Developer">Web Developer</label>
    <label><input type="radio" name="Job Details" value="Software Engineer">Software Engineer</label>
    <label><input type="radio" name="Job Details" value="Data Analyst">Data Analyst</label>
    <label><input type="radio" name="Job Details" value="Graphic Designer">Graphic Designer</label>
    <br><br>
    <label>Expected Salary:</label>
    <label><input type="radio" name="Expected Salary" value="30,000–50,000">30,000–50,000</label>
    <label><input type="radio" name="Expected Salary" value="50,000–100,000">50,000–100,000</label>
    <label><input type="radio" name="Expected Salary" value="100,000+">100,000+</label>
    <br><br>
    <label>Work Experience:</label>
    <label><input type="Radio" name=" Work Experience" value="Fresher">Fresher</label>
    <label><input type="Radio" name=" Work Experience" value="1–3 years">1–3 years</label>
    <label><input type="Radio" name=" Work Experience" value="3–5 years">3–5 years</label>
    <label><input type="Radio" name=" Work Experience" value="5+ years">5+ years</label>
    <br><br>
    <label>Employment Type:</label>
    <label><input type="Radio" name=" Employment Type" value="Full-time">Full-time</label>
    <label><input type="Radio" name=" Employment Type" value="Part-time">Part-time</label>
    <label><input type="Radio" name=" Employment Type" value="Internship">Internship</label>
    <label><input type="Radio" name=" Employment Type" value="Remote">Remote</label>
    <br><br>
    <h2><u>Additional Information</u></h2>
    <label>Highest Education:</label>
    <label><input type="Radio" name=" Highest Education" value="Matriculation">Matriculation</label>
    <label><input type="Radio" name=" Highest Education" value="Intermediate">Intermediate</label>
    <label><input type="Radio" name=" Highest Education" value="Bachelor's Degree">Bachelor's Degree</label>
    <label><input type="Radio" name=" Highest Education" value="Master's Degree">Master's Degree</label>
    <br><br>
    <label>Skills:</label>
    <label><input type="checkbox" name="Skills" value="HTML">HTML</label>
    <label><input type="checkbox" name="Skills" value="CSS">CSS</label>
    <label><input type="checkbox" name="Skills" value="JavaScript">JavaScript</label>
    <label><input type="checkbox" name="Skills" value="Python">Python</label>
    <label><input type="checkbox" name="Skills" value="C++">C++</label>
    <br><br>
    <label>Why Should We Hire You?</label>
    <textarea placeholder="Enter your text here..." cols="40" rows="5"></textarea>
    <br><br>
    <h2><u>Confirmation</u></h2>
    <label>Terms & Conditions: <input type="checkbox" name="Confirmation" value="I have read and agree to the Terms & Conditions.">I have read and agree to the Terms & Conditions.</label>
    <br><br>
    <button>Submit</button> 
    <button>Reset</button>
</body>
</html>
